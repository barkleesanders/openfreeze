name: OpenFreeze
options:
  bundleIdPrefix: com.openfreeze
  deploymentTarget:
    macOS: "12.3"
configs:
  Debug: debug
  Release: release
settingGroups:
  openfreeze-signing:
    base:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Apple Distribution: ESBE Incorporated (2KJ8W6N44B)"
      DEVELOPMENT_TEAM: 2KJ8W6N44B
      SWIFT_VERSION: "5.0"
      ENABLE_HARDENED_RUNTIME: YES
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  OpenFreeze:
    type: application
    platform: macOS
    bundleId: com.openfreeze.OpenFreeze
    sources:
      - path: App
        excludes:
          - Info.plist
          - OpenFreeze.entitlements
    info:
      path: App/Info.plist
    entitlements:
      path: App/OpenFreeze.build.entitlements
    settings:
      groups: [openfreeze-signing]
      base:
        CODE_SIGN_ENTITLEMENTS: App/OpenFreeze.build.entitlements
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.openfreeze.OpenFreeze
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - target: OpenFreezeCameraExtension
    postBuildScripts:
      - name: Embed Camera System Extension
        runOnlyWhenInstalling: false
        script: |
          set -e
          EXT_BUNDLE=$(ls -d "${BUILT_PRODUCTS_DIR}"/*.systemextension 2>/dev/null | head -1)
          if [ -z "$EXT_BUNDLE" ]; then echo "warning: no .systemextension found in ${BUILT_PRODUCTS_DIR}"; exit 0; fi
          DST_DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/SystemExtensions"
          mkdir -p "$DST_DIR"
          rm -rf "${DST_DIR}/$(basename "$EXT_BUNDLE")"
          cp -R "$EXT_BUNDLE" "$DST_DIR/"
          echo "Embedded $(basename "$EXT_BUNDLE")"
  OpenFreezeCameraExtension:
    type: system-extension
    platform: macOS
    bundleId: com.openfreeze.OpenFreeze.cameraextension
    sources:
      - path: Extension
        excludes:
          - Info.plist
    info:
      path: Extension/Info.plist
    settings:
      groups: [openfreeze-signing]
      base:
        INFOPLIST_FILE: Extension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.openfreeze.OpenFreeze.cameraextension
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
